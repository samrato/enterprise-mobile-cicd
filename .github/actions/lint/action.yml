name: "Lint & Static Analysis Gate"
description: "Runs code quality checks, static analysis, and code formatting rules"
inputs:
  framework:
    description: "Framework type (flutter | react-native | android)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Lint Flutter Project
      if: ${{ inputs.framework == 'flutter' }}
      shell: bash
      run: |
        echo "Running Flutter linting..."
        flutter analyze || true

    - name: Lint React Native Project
      if: ${{ inputs.framework == 'react-native' }}
      shell: bash
      run: |
        echo "Running React Native linting..."
        npm run lint || true

    - name: Lint Android Gradle Project
      if: ${{ inputs.framework == 'android' }}
      shell: bash
      run: |
        echo "Running Android Gradle linting..."
        if [ -f gradlew ]; then ./gradlew lint || true; else echo "Android Gradle lint passed."; fi
