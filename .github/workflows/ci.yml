name: "CI Pipeline Gate"

on:
  pull_request:
    branches: [ develop, "release/*", main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-config:
    name: "Validate Configurations & Schemas"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: pip install pyyaml jsonschema

      - name: Validate Templates & Examples
        run: |
          python scripts/validate-config.py templates/mobile-ci.yaml schemas/mobile-ci.schema.json
          for file in examples/*/mobile-ci.yaml; do
            echo "Validating $file..."
            python scripts/validate-config.py "$file" schemas/mobile-ci.schema.json
          done

  test-example-apps:
    name: "Pipeline Test - ${{ matrix.app.name }}"
    needs: [validate-config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: "React Native Sample"
            path: "examples/react-native-app"
            framework: "react-native"
          - name: "Flutter Sample"
            path: "examples/flutter-app"
            framework: "flutter"
          - name: "Android Kotlin Sample"
            path: "examples/android-kotlin-app"
            framework: "android"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Framework
        id: detect
        run: |
          FRAMEWORK=$(bash scripts/detect-framework.sh "${{ matrix.app.path }}")
          echo "Detected framework: $FRAMEWORK"

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          framework: ${{ matrix.app.framework }}

      - name: Run Lint Gate
        uses: ./.github/actions/lint
        with:
          framework: ${{ matrix.app.framework }}

      - name: Run Test Gate
        uses: ./.github/actions/test
        with:
          framework: ${{ matrix.app.framework }}

      - name: Run Security Gate
        uses: ./.github/actions/security-scan
        with:
          framework: ${{ matrix.app.framework }}
