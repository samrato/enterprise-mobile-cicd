name: "CI Pipeline Gate"

on:
  pull_request:
    branches: [ develop, "release/*", main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-config:
    name: "Validate mobile-ci.yaml Configs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: pip install pyyaml jsonschema

      - name: Validate Templates & Examples
        run: |
          python scripts/validate-config.py templates/mobile-ci.yaml schemas/mobile-ci.schema.json
          for file in examples/*/mobile-ci.yaml; do
            echo "Validating $file..."
            python scripts/validate-config.py "$file" schemas/mobile-ci.schema.json
          done

  detect-framework:
    name: "Detect Example Frameworks"
    needs: [validate-config]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Framework Detection across Examples
        run: |
          for dir in examples/*; do
            FRAMEWORK=$(bash scripts/detect-framework.sh "$dir")
            echo "Directory $dir detected as: $FRAMEWORK"
          done
