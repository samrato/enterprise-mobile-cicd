name: "CI Pipeline Gate"

on:
  pull_request:
    branches: [ develop, "release/*", main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-config:
    name: "Validate Configurations & Schemas"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: pip install pyyaml jsonschema

      - name: Validate Templates & Examples
        run: |
          python scripts/validate-config.py templates/mobile-ci.yaml schemas/mobile-ci.schema.json
          for file in examples/*/mobile-ci.yaml; do
            echo "Validating $file..."
            python scripts/validate-config.py "$file" schemas/mobile-ci.schema.json
          done

  test-example-apps:
    name: "Pipeline Test - ${{ matrix.app.name }}"
    needs: [validate-config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: "React Native Sample"
            path: "examples/react-native-app"
            framework: "react-native"
          - name: "Flutter Sample"
            path: "examples/flutter-app"
            framework: "flutter"
          - name: "Android Kotlin Sample"
            path: "examples/android-kotlin-app"
            framework: "android"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. Detect Framework
        id: detect
        run: |
          FRAMEWORK=$(bash scripts/detect-framework.sh "${{ matrix.app.path }}")
          echo "Detected framework: $FRAMEWORK"

      - name: 2. Setup Environment
        uses: ./.github/actions/setup-env
        with:
          framework: ${{ matrix.app.framework }}
          working-directory: ${{ matrix.app.path }}

      - name: 3. Lint Gate
        uses: ./.github/actions/lint
        with:
          framework: ${{ matrix.app.framework }}

      - name: 4. Test Gate
        uses: ./.github/actions/test
        with:
          framework: ${{ matrix.app.framework }}

      - name: 5. Security Scan Gate
        uses: ./.github/actions/security-scan
        with:
          framework: ${{ matrix.app.framework }}

      - name: 6. Build Artifact
        id: build
        uses: ./.github/actions/build
        with:
          framework: ${{ matrix.app.framework }}
          output-type: "apk"

      - name: 7. Sign Artifact
        uses: ./.github/actions/signing
        with:
          artifact-path: ${{ steps.build.outputs.artifact-path }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 8. Deploy to Play Console
        uses: ./.github/actions/deploy-play
        with:
          package-name: "com.company.app"
          artifact-path: ${{ steps.build.outputs.artifact-path }}
          track: "internal"
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: 9. Send Notification
        if: always()
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          environment: "CI Matrix Test"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
